            - paragraph [ref=e145]:
              - emphasis [ref=e146]: A beginner’s guide to going from idea to polished, production-ready UI in under an hour — no design experience required.
          - separator [ref=e147]
          - generic [ref=e153]:
            - paragraph [ref=e154]: Not long ago, shipping a polished app design required Figma expertise, a dedicated designer, and a painstaking handoff process to engineers. Today, that entire pipeline has collapsed into a single morning of work.
            - paragraph [ref=e155]:
              - text: Two tools
              - link "Google Stitch" [ref=e156] [cursor=pointer]:
                - /url: https://stitch.withgoogle.com/
              - text: and
              - link "Claude Code" [ref=e157] [cursor=pointer]:
                - /url: https://claude.com/product/claude-code
              - text: have made it possible for anyone. You design your app in Stitch using plain English prompts, then copy or export the generated code and hand it to Claude Code, which builds out the full working app for you. No Figma skills, no manually writing CSS, no describing your design in words and hoping the AI gets it right.
            - paragraph [ref=e158]: For those who want to go further, an optional MCP (Model Context Protocol) connection lets Stitch talk to Claude Code directly so your design data flows in without any copypasting. But even without MCP, the core workflow is fast, free and suprisingly powerful.
            - paragraph [ref=e159]: This guide walks you through every step, even if you have never touched a design tool or AI coding assistant before.
          - separator [ref=e160]
          - generic [ref=e166]:
            - heading "1. What are these tools, and why do they work so well together?" [level=3] [ref=e167]
            - paragraph [ref=e168]:
              - strong [ref=e169]: Google Stitch
            - paragraph [ref=e170]:
              - link "Google Stitch" [ref=e171] [cursor=pointer]:
                - /url: https://stitch.withgoogle.com/
              - text: is a free AI-powered UI design tool built by Google Labs. You describe what you want in plain english, and it generates a complete, high-fidelity interface screens, components, color palettes, and all powered by Google’s Gemini AI models.
            - paragraph [ref=e172]: "The March 2026 update was a major leap forward. Stitch now features:"
            - list [ref=e173]:
              - listitem [ref=e174]: An AI-native infinite canvas where you can combine images, text, code and UI components side by side.
              - listitem [ref=e175]: Generation of up to five screens simultaneously, instead of one at a time
              - listitem [ref=e176]: A built-in design agent that reasons across your entire project history
              - listitem [ref=e177]: Interactive prototyping — click “Play” to simulate your app’s user journey
              - listitem [ref=e178]: Voice commands for real-time design critiques and on-the-fly changes
              - listitem [ref=e179]: DESIGN.md — an agent friendly markdown file that exports your full design system (colors, typography, spacing, components) for use in other tools
            - paragraph [ref=e180]:
              - strong [ref=e181]: Claude Code
            - paragraph [ref=e182]:
              - link "Claude Code" [ref=e183] [cursor=pointer]:
                - /url: https://claude.com/product/claude-code
              - text: is Anthropic’s AI coding assistant that runs in your terminal. Unlike chat based coding tools, Claude Code operates directly inside your project — reading files, writing code, and executing commands autonomously. Give it a task and it handles the full implementation.
            - paragraph [ref=e184]: It is available with Claude.ai Pro plan ($20/month or higher)
            - paragraph [ref=e185]:
              - strong [ref=e186]: "MCP: The Bridge Between Them"
            - paragraph [ref=e187]: "MCP (Model Context Protocol) is an open standard that lets AI tools talk to each other through a shared interface. The stitch-mcp package acts as a bridge: it connects Claude Code directly to your Stitch project, letting Claude read your design data (layout, colors, HTML, screenshots) and implement it as real code — without any manual copy-pasting."
          - separator [ref=e188]
          - generic [ref=e194]:
            - heading "2. Setting Up Claude Code + Stitch MCP" [level=3] [ref=e195]
            - paragraph [ref=e196]: The setup has a few steps, but you only do this once. Here is a complete walkthrough.
            - paragraph [ref=e197]:
              - strong [ref=e198]: "Step 1: Install Claude Code"
            - paragraph [ref=e199]: Claude Code requires Node.js (v18 or later). Install it from nodejs.org if you do not have it, then run
            - generic [ref=e201]: npm install -g @anthropic-ai/claude-code
            - paragraph [ref=e202]: "Authenticate with your Anthropic account:"
            - generic [ref=e204]: claude login
            - paragraph [ref=e205]:
              - strong [ref=e206]: "Step 2: Get Your Stitch API Key"
            - paragraph [ref=e207]: This is straightforward — no Google Cloud setup required.
            - list [ref=e208]:
              - listitem [ref=e209]: Go to stitch.withgoogle.com and sign in with your Google account
              - listitem [ref=e210]: Open Settings (top-right corner)
              - listitem [ref=e211]: Navigate to the API Keys section and create a new key
              - listitem [ref=e212]: Copy the key and keep it somewhere safe
            - paragraph [ref=e213]:
              - strong [ref=e214]: "Step 3: Connect Stitch to Claude Code"
            - paragraph [ref=e215]: "Run this single command in your terminal, replacing YOUR-API-KEY with the key you just copied:"
            - generic [ref=e217]: "claude mcp add stitch --transport http https://stitch.googleapis.com/mcp --header \"X-Goog-Api-Key: YOUR-API-KEY\""
            - paragraph [ref=e218]: That is it. Claude Code registers the Stitch MCP server automatically — no config files to edit, no JSON to write.
            - 'heading "3. Designing in Google Stitch: Prompting for Great UI" [level=3] [ref=e219]'
            - paragraph [ref=e220]: The quality of what Stitch generates depends heavily on how you describe it. Most people get mediocre results because they type one vague sentence. Here is a framework that producrs production-quality designs consistently.
            - paragraph [ref=e221]:
              - strong [ref=e222]: The 4-Part Prompt Formula
            - paragraph [ref=e223]:
              - strong [ref=e224]: "Part 1: App Type + Platform"
            - paragraph [ref=e225]: Start by telling Stitch exactly what kind of interface you are building and where it will live.
            - paragraph [ref=e226]:
              - strong [ref=e227]: "Example:"
              - text: “A mobile iOS app” or “A web dashboard” or “A SaaS onboarding flow”
            - paragraph [ref=e228]:
              - strong [ref=e229]: "Part 2: Purpose + Target User"
            - paragraph [ref=e230]: Explain what the app does and who is using it. This shapes layout decisions, visual weight, and information density.
            - paragraph [ref=e231]:
              - strong [ref=e232]: "Example:"
              - text: “for project managers who need to track team tasks at a glance”
            - paragraph [ref=e233]:
              - strong [ref=e234]: "Part 3: Screen + Key Components"
            - paragraph [ref=e235]: List the specific screens and the components each screen needs. The more specific you are, the closer the first draft will be to what you want.
            - paragraph [ref=e236]:
              - strong [ref=e237]: "Example:"
              - text: “Dashboard screen with KPI cards at the top, a line chart showing weekly activity, and a task list below. Sidebar navigation with Home, Projects, Team, and Settings”
            - paragraph [ref=e238]:
              - strong [ref=e239]: "Part 4: Visual Style"
            - paragraph [ref=e240]: Describe the aesthetic — color scheme, mood, reference apps. Stitch interprets style cues well.
            - paragraph [ref=e241]:
              - strong [ref=e242]: "Example:"
              - text: “Dark theme, clean and minimal, inspired by Linear and Vercel Blue accent colors, monospace font for code snippets.”
            - paragraph [ref=e243]:
              - strong [ref=e244]: Full Example Prompt
            - paragraph [ref=e245]: "Putting it all together:"
            - generic [ref=e247]:
              - text: "\"A web SaaS dashboard for a project management tool used by\","
              - text: "\"software teams. I need three screens:\","
              - text: "\"\","
              - text: "\"1. Overview Dashboard: KPI cards (open tasks, completed today,\","
              - text: "\" team velocity), a line chart for sprint progress, and a\","
              - text: "\" recent activity feed.\","
              - text: "\"\","
              - text: "\"2. Task Board: Kanban columns (Backlog, In Progress, Review,\","
              - text: "\" Done) with draggable task cards showing assignee avatar,\","
              - text: "\" priority label, and due date.\","
              - text: "\"\","
              - text: "\"3. Settings Page: Profile section, notification preferences,\","
              - text: "\" and team members table.\","
              - text: "\"\","
              - text: "\"Dark theme, minimal design. Sidebar navigation. Inspired by\","
              - text: "\"Linear. Blue and purple accent colors.\""
            - paragraph [ref=e248]:
              - strong [ref=e249]: Iteration Tips
            - list [ref=e250]:
              - listitem [ref=e251]: "Start broad, then drill down: Generate all screens first, then refine each one individually"
              - listitem [ref=e252]: "Use chat to tweak without regenerating: ‘Move the chart to the right side’ or ‘Make the sidebar narrower’ works without starting over"
              - listitem [ref=e253]: "Use the multi-select trick: Hold Shift, select multiple screens, and apply a single prompt to update all of them at once — great for theme changes"
              - listitem [ref=e254]:
                - strong [ref=e255]: "Voice canvas:"
                - text: Speak your changes out loud. Say ‘give me three different color palettes for this screen’ and watch Stitch respond in real time
              - listitem [ref=e256]: "Generate the DESIGN.md file: Go to Export > DESIGN.md to create your design system file before connecting to Claude Code. This gives Claude the full context it needs"
          - separator [ref=e257]
          - generic [ref=e263]:
            - heading "4. Connecting Stitch to Claude Code via MCP" [level=3] [ref=e264]
            - paragraph [ref=e265]: Once your design looks good in Stitch, the next step is getting Claude Code to implement it. There are two ways to do this — starting with the simpler one.
            - paragraph [ref=e266]:
              - strong [ref=e267]: "Path A: Copy & Export (The Default Way)"
            - paragraph [ref=e268]: This is the quickest path and requires no extra setup.
            - paragraph [ref=e269]: 5. In Stitch, open the screen you want to build
            - paragraph [ref=e270]: 6. Click the code panel on the right — Stitch shows you the generated HTML and CSS
            - paragraph [ref=e271]: 7. Copy the code, or use Export > DESIGN.md to get your full design system as a markdown file
            - paragraph [ref=e272]: "8. Open Claude Code in your project and paste it in:"
            - generic [ref=e274]:
              - text: "\"Here is the design code for my dashboard screen [paste code]."
              - text: Build this as a React component with Tailwind CSS."
            - paragraph [ref=e275]: Claude reads the design and starts generating. For a landing page or simple screen, expect working code in a few minutes. You can also paste the DESIGN.md file to give Claude your full design system — colors, typography, spacing — so it stays consistent across every screen it builds.
            - paragraph [ref=e276]:
              - strong [ref=e277]: "Path B: Direct MCP Connection (Advanced)"
            - paragraph [ref=e278]: "If you are building a multi-screen app and want a live connection between Stitch and Claude Code — so Claude can pull design data directly without any copy-pasting — MCP is the way to go. See Section 2 for the full setup. Once connected, you simply tell Claude:"
            - paragraph [ref=e279]:
              - strong [ref=e280]: "The build_site Command: Scaffold an Entire App at Once"
            - paragraph [ref=e281]: "For multi-screen apps, the build_site tool maps your Stitch screens to routes and generates a deployable site structure:"
            - generic [ref=e283]:
              - text: npx @_davideast/stitch-mcp tool build_site -d '
              - text: "{"
              - text: "\"projectId\": \"YOUR_PROJECT_ID\","
              - text: "\"routes\": ["
              - text: "{ \"screenId\": \"abc123\", \"route\": \"/\" },"
              - text: "{ \"screenId\": \"def456\", \"route\": \"/dashboard\" },"
              - text: "{ \"screenId\": \"ghi789\", \"route\": \"/settings\" }"
              - text: "]"
              - text: "}'"
            - paragraph [ref=e284]: "Find your screen IDs by running:"
            - generic [ref=e286]: npx @_davideast/stitch-mcp view --project YOUR_PROJECT_ID
          - separator [ref=e287]
          - generic [ref=e293]:
            - 'heading "5. Workflow & Iteration: From Design to Deployed Code" [level=3] [ref=e294]'
            - paragraph [ref=e295]: Here is the end-to-end workflow that gets you from blank canvas to working app.
            - paragraph [ref=e296]:
              - strong [ref=e297]: The Full Workflow
            - generic [ref=e298]:
              - heading "Get Ebubechukwu Ugbor’s stories in your inbox" [level=2] [ref=e300]
              - paragraph [ref=e302]: Join Medium for free to get updates from this writer.
              - generic [ref=e303]:
                - textbox "Enter your email" [ref=e307]
                - button "Subscribe" [ref=e310]
              - generic [ref=e312]:
                - generic [ref=e313]:
                  - checkbox "Remember me for faster sign in" [checked]
                  - img [ref=e315] [cursor=pointer]
                - paragraph [ref=e318]: Remember me for faster sign in
            - paragraph [ref=e319]:
              - strong [ref=e320]: "Phase 1: Design (20–40 minutes)"
            - list [ref=e321]:
              - listitem [ref=e322]: Open stitch.withgoogle.com
              - listitem [ref=e323]: Choose Experimental Mode for your first pass
              - listitem [ref=e324]: Use the 4-part prompt formula to describe your app
              - listitem [ref=e325]: Review the generated screens — compare multiple variants
              - listitem [ref=e326]: Refine with follow-up prompts or voice commands
              - listitem [ref=e327]: Use the multi-screen generator to create all your key screens
              - listitem [ref=e328]: Click ‘Play’ to preview your interactive prototype
              - listitem [ref=e329]: Export DESIGN.md from the canvas
            - paragraph [ref=e330]:
              - strong [ref=e331]: "Phase 2: Implementation (20–30 minutes)"
            - list [ref=e332]:
              - listitem [ref=e333]: In Stitch, open each screen and copy the generated code from the code panel
              - listitem [ref=e334]: Export DESIGN.md for your full design system (colors, fonts, spacing)
              - listitem [ref=e335]: Open Claude Code in your project directory
              - listitem [ref=e336]: "Paste the code and instruct Claude: ‘Build the dashboard screen as a React component using this design code’"
              - listitem [ref=e337]: Review Claude’s output in your browser
              - listitem [ref=e338]: "Use Claude to fix specifics: ‘The nav sidebar is too wide, reduce it to 240px’"
              - listitem [ref=e339]: (Optional) Set up MCP for a live connection if you want Claude to pull updates automatically
            - paragraph [ref=e340]:
              - strong [ref=e341]: "Phase 3: Polish (10–20 minutes)"
            - list [ref=e342]:
              - listitem [ref=e343]: Swap placeholder images for real ones
              - listitem [ref=e344]: Add hover states and transitions (Stitch designs are static — interactions need to be specified)
              - listitem [ref=e345]: Check spacing and padding in the browser — AI often gets these close but not exact
              - listitem [ref=e346]: Test on mobile if targeting responsive layouts
            - paragraph [ref=e347]: "Total time from blank canvas to a working, shareable prototype: 60–90 minutes. A year ago, the same work took a designer half a day and a developer a full day."
            - paragraph [ref=e348]:
              - strong [ref=e349]: What Claude Code Does Well
            - list [ref=e350]:
              - listitem [ref=e351]: Reading complex design specs and translating them into clean component code
              - listitem [ref=e352]: Maintaining design consistency across multiple screens using the DESIGN.md context
              - listitem [ref=e353]: Generating TypeScript types for data structures implied by the UI
              - listitem [ref=e354]: Wiring up routing between screens
              - listitem [ref=e355]: Adapting Stitch’s HTML/CSS output into React + Tailwind patterns
            - paragraph [ref=e356]:
              - strong [ref=e357]: What Still Needs Human Judgement
            - list [ref=e358]:
              - listitem [ref=e359]: Spacing tweaks — AI gets padding and margins close, but pixel-perfect polish requires manual review
              - listitem [ref=e360]: Placeholder content — replace generated text and images with real content
              - listitem [ref=e361]: Complex animations and micro-interactions
              - listitem [ref=e362]: Accessibility audit — add proper ARIA labels and keyboard navigation
              - listitem [ref=e363]: Brand alignment — Stitch’s color choices may not match your exact brand tokens
            - heading "6. Real Examples" [level=3] [ref=e364]
            - paragraph [ref=e365]:
              - strong [ref=e366]: "Example 1: SaaS Landing Page"
            - paragraph [ref=e367]: "Prompt used in Stitch:"
            - paragraph [ref=e368]: “Landing page for an AI writing assistant called InkFlow.
            - paragraph [ref=e369]: Web, modern SaaS aesthetic. Clean white background,
            - paragraph [ref=e370]: purple and indigo accents.
            - paragraph [ref=e371]: "Sections: Hero (headline, subheadline, CTA button, product"
            - paragraph [ref=e372]: screenshot mockup), Features (3 cards with icons), Social
            - paragraph [ref=e373]: proof (3 customer quotes with avatars), Pricing (2 tiers,
            - paragraph [ref=e374]: monthly/annual toggle), Footer with links.”
            - paragraph [ref=e375]: "What Stitch generated: Four complete screen variants in under 30 seconds. The hero section had a clean headline layout with a visible product screenshot area, the feature cards used a consistent icon style, and the pricing section correctly rendered the two-tier structure."
            - paragraph [ref=e376]: "Claude Code instruction after connecting via MCP:"
            - paragraph [ref=e377]: “Implement the first landing page variant as a Next.js page
            - paragraph [ref=e378]: component with Tailwind CSS. Use the InkFlow project color
            - paragraph [ref=e379]: tokens from DESIGN.md.”
            - paragraph [ref=e380]: "Result: A deployable Next.js page in approximately 12 minutes of generation time."
            - paragraph [ref=e381]:
              - strong [ref=e382]: "Example 2: Mobile Dashboard"
            - paragraph [ref=e383]: "Prompt used in Stitch:"
            - paragraph [ref=e384]: “Mobile iOS app dashboard for a personal finance tracker.
            - paragraph [ref=e385]: Dark theme, minimal. Shows monthly spending by category
            - paragraph [ref=e386]: as a donut chart, recent transactions list, and quick
            - paragraph [ref=e387]: action buttons (Add Expense, Transfer, Pay). Bottom tab
            - paragraph [ref=e388]: "navigation: Home, Budget, Cards, Profile.”"
            - paragraph [ref=e389]: "What Stitch generated: A complete dark-mode mobile layout with a clean donut chart placeholder, well-spaced transaction rows, and a bottom tab bar with correct spacing for iOS."
            - paragraph [ref=e390]: "Common issues and fixes:"
            - list [ref=e391]:
              - listitem [ref=e392]:
                - strong [ref=e393]: "Chart type:"
                - text: "Stitch generated a pie chart instead of a donut. Fix: ‘Change the portfolio chart to a donut chart with a centered total amount label’"
              - listitem [ref=e394]:
                - strong [ref=e395]: "Navigation label alignment:"
                - text: "Tab labels were centered but not aligned below icons. Fix: ‘Align each tab label directly below its icon with 4px gap’"
            - heading "7. Troubleshooting Common Issues" [level=3] [ref=e396]
            - paragraph [ref=e397]:
              - strong [ref=e398]: MCP connection not working
            - list [ref=e399]:
              - listitem [ref=e400]: Run npx @_davideast/stitch-mcp doctor — verbose to diagnose
              - listitem [ref=e401]: Double-check your STITCH_API_KEY is set correctly — regenerate it in Stitch Settings if needed
              - listitem [ref=e402]: Restart Claude Code after updating your MCP config
            - paragraph [ref=e403]:
              - strong [ref=e404]: Stitch output quality is low
            - list [ref=e405]:
              - listitem [ref=e406]: Switch to Experimental Mode (Gemini 2.5 Pro) for better results
              - listitem [ref=e407]: Add more specific detail to your prompt — vague prompts produce generic layouts
              - listitem [ref=e408]: Upload a reference screenshot or sketch if you have one — Stitch uses it as visual context
            - paragraph [ref=e409]:
              - strong [ref=e410]: Claude is not matching the design accurately
            - list [ref=e411]:
              - listitem [ref=e412]: Make sure you exported and shared the DESIGN.md file with Claude
              - listitem [ref=e413]: "Use get_screen_image to give Claude a screenshot of the screen: ‘Look at the screenshot for screen abc123 and match it closely’"
              - listitem [ref=e414]: "Be specific about the tech stack: ‘React with Tailwind CSS, not inline styles’"
            - paragraph [ref=e415]:
              - strong [ref=e416]: Final Thoughts
            - paragraph [ref=e417]: The Stitch + Claude Code + MCP workflow is one of the most significant shifts in how software gets built. It does not eliminate the need for design judgment — you still decide what looks right, what feels intuitive, and what matches your brand. But it removes the bottleneck between having an idea and seeing it rendered, designed, and coded.
            - paragraph [ref=e418]: "For solo builders, the time savings are remarkable. For teams, it changes the role of the designer from pixel-pusher to creative director: prompt, review, and refine — rather than manually constructing every component."
            - paragraph [ref=e419]: The best way to understand it is to use it. Go to stitch.withgoogle.com, describe your next screen, and see what comes back in 30 seconds. Then connect Claude Code and watch it turn that design into real code.
            - paragraph [ref=e420]: The whole pipeline — from prompt to prototype — is genuinely available to anyone right now.
            - paragraph [ref=e421]:
              - strong [ref=e422]: Tools referenced in this article
            - list [ref=e423]:
