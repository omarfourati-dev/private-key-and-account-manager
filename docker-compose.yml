version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pkm-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://zentrades:${DB_PASSWORD}@host.docker.internal:5433/securevault
      ALLOWED_ORIGINS: https://securevault.omarfourati.de
      BACKEND_URL: ${BACKEND_URL:-https://securevault.omarfourati.de}
      FRONTEND_URL: ${FRONTEND_URL:-https://securevault.omarfourati.de}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - pkm-internal
      - web
    command: >
      sh -c "npx prisma migrate deploy && node dist/index.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pkm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - pkm-internal
      - web

networks:
  pkm-internal:
    driver: bridge
  web:
    external: true
