name: CI & Deploy – securevault.omarfourati.de

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_DIR: /home/securevault

jobs:
  # ─── Frontend ────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─── Backend ─────────────────────────────────────────
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          JWT_ACCESS_SECRET: "test-access-secret-minimum-32-chars-long"
          JWT_REFRESH_SECRET: "test-refresh-secret-minimum-32-chars-long"
          NODE_ENV: test

  # ─── Deploy (nur main, nur wenn CI grün) ─────────────
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    environment: production
    needs: [frontend-build, backend-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code to deploy directory
        run: |
          mkdir -p $DEPLOY_DIR
          rsync -rlD --no-owner --no-group --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            $GITHUB_WORKSPACE/ $DEPLOY_DIR/

      - name: Ensure Docker network 'web' exists
        run: docker network create web 2>/dev/null || echo "Network 'web' already exists – skipping."

      - name: Create database if not exists
        run: |
          docker exec zentrades-postgres psql -U zentrades \
            -c "CREATE DATABASE securevault;" 2>/dev/null \
            || echo "Database 'securevault' already exists – skipping."

      - name: Write .env
        run: |
          {
            echo "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET"
            echo "JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            echo "BACKEND_URL=$BACKEND_URL"
            echo "FRONTEND_URL=$FRONTEND_URL"
          } > $DEPLOY_DIR/.env
        env:
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

      - name: Stop old containers if running
        run: |
          docker rm -f pkm-backend pkm-frontend 2>/dev/null || true

      - name: Build images
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose build --no-cache

      - name: Start / restart services
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose up -d --remove-orphans

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 12); do
            if docker inspect --format='{{.State.Health.Status}}' pkm-backend 2>/dev/null | grep -q "healthy"; then
              echo "Backend is healthy."
              exit 0
            fi
            echo "  Attempt $i/12 – waiting 10s..."
            sleep 10
          done
          echo "Backend did not become healthy in time."
          cd $DEPLOY_DIR && docker compose logs backend --tail=50
          exit 1

      - name: Show running containers
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose ps
