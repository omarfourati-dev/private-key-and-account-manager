# Sicherheits-Header für alle Antworten des Frontends.
#
# Wird in den server-Block UND in jeden location-Block mit eigenem add_header eingebunden:
# nginx erbt add_header nur, solange eine Ebene selbst keines setzt — ohne das Include
# würden z. B. /index.html (Cache-Control) oder die Assets die Header stillschweigend verlieren.
#
# CSP: keine Inline-Skripte, keine Fremd-Hosts außer der selbst gehosteten Umami-Instanz.
# style-src 'unsafe-inline' ist nötig, weil react-hot-toast (goober) zur Laufzeit <style>-Elemente einfügt.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.omarfourati.de; connect-src 'self' https://analytics.omarfourati.de; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Caddy setzt kein HSTS für securevault.omarfourati.de — daher hier (Caddy reicht den Header per HTTPS durch)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
