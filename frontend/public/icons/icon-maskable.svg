<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1f"/>
      <stop offset="100%" stop-color="#1c1c38"/>
    </linearGradient>
    <linearGradient id="key" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b79f8"/>
      <stop offset="100%" stop-color="#6a57f0"/>
    </linearGradient>
  </defs>
  <!-- Full bleed for maskable (safe zone is inner 80%) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Key icon centered in safe zone (approx 102-410 area) -->
  <circle cx="220" cy="220" r="60" fill="none" stroke="url(#key)" stroke-width="28"/>
  <line x1="266" y1="256" x2="365" y2="330" stroke="url(#key)" stroke-width="28" stroke-linecap="round"/>
  <line x1="343" y1="315" x2="343" y2="348" stroke="url(#key)" stroke-width="24" stroke-linecap="round"/>
  <line x1="310" y1="292" x2="310" y2="322" stroke="url(#key)" stroke-width="24" stroke-linecap="round"/>
</svg>
